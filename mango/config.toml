# Mango Window Manager Configuration (TOML Format)
# Save this directly to ~/.config/mango/config.toml

# Startup Actions
exec_once = "noctalia"
exec_once = "pipewire"
# Window Effects
blur = 0
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0

border_radius = 6
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0

# Animations
animations = 0
layer_animations = 1
animation_type_open = "slide"
animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
animation_duration_move = 500
animation_duration_open = 400
animation_duration_tag = 350
animation_duration_close = 800
animation_duration_focus = 0
animation_curve_open = [0.46, 1.0, 0.29, 1.0]
animation_curve_move = [0.46, 1.0, 0.29, 1.0]
animation_curve_tag = [0.46, 1.0, 0.29, 1.0]
animation_curve_close = [0.08, 0.92, 0.0, 1.0]
animation_curve_focus = [0.46, 1.0, 0.29, 1.0]

# Scroller Layout Properties
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Dwindle Layout Properties
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_preserve_split = 0

# Overview Settings
hotarea_size = 10
enable_hotarea = 0

# Window Management Behavior
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
focus_cross_monitor = 0
focus_cross_tag = 0
enable_floating_snap = 0
snap_distance = 30
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1

# Input Preferences (Keyboard, Mouse, Trackpad)
repeat_rate = 25
repeat_delay = 600
xkb_rules_layout = "us"
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 0
swipe_min_threshold = 1
mouse_natural_scrolling = 0
mouse_accel_profile = 0

# Dimensions & Gaps
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

# Core Keybindings Array
bind = [
    # System Controls
    "SUPER,r,reload_config",
    "SUPER,m,quit",
    "SUPER,q,killclient",

    # Launchers
    "SUPER,space,spawn,rofi -show drun",
    "SUPER,Return,spawn,foot",

    # Focus Movement
    "SUPER,Tab,focusstack,next",
    "SUPER,Left,focusdir,left",
    "SUPER,Right,focusdir,right",
    "SUPER,Up,focusdir,up",
    "SUPER,Down,focusdir,down",

    # Window Layout Actions
    "SUPER+SHIFT,Up,exchange_client,up",
    "SUPER+SHIFT,Down,exchange_client,down",
    "SUPER+SHIFT,Left,exchange_client,left",
    "SUPER+SHIFT,Right,exchange_client,right",

    # Interface Toggles
    "SUPER,g,toggleglobal",
    "ALT,Tab,toggleoverview",
    "ALT,backslash,togglefloating",
    "ALT,a,togglemaximizescreen",
    "SUPER,f,togglefullscreen",
    "ALT+SHIFT,f,togglefakefullscreen",
    "SUPER,i,minimized",
    "SUPER,o,toggleoverlay",
    "SUPER+SHIFT,I,restore_minimized",
    "ALT,z,toggle_scratchpad",

    # Scroller Adjustments
    "ALT,e,set_proportion,1.0",
    "ALT,x,switch_proportion_preset",
    "alt+super+ctrl,Left,scroller_stack,left",
    "alt+super+ctrl,Right,scroller_stack,right",
    "alt+super+ctrl,Up,scroller_stack,up",
    "alt+super+ctrl,Down,scroller_stack,down",

    # Dwindle Operations
    "alt+shift,Return,dwindle_toggle_split_direction",
    "SUPER,n,switch_layout",

    # Workspace Tag Changes
    "ALT,Left,viewtoleft,0",
    "CTRL,Left,viewtoleft_have_client,0",
    "ALT,Right,viewtoright,0",
    "CTRL,Right,viewtoright_have_client,0",
    "CTRL+SUPER,Left,tagtoleft,0",
    "CTRL+SUPER,Right,tagtoright,0",

    # Tag Views (1-9)
    "SUPER,1,view,1,0",
    "SUPER,2,view,2,0",
    "SUPER,3,view,3,0",
    "SUPER,4,view,4,0",
    "SUPER,5,view,5,0",
    "SUPER,6,view,6,0",
    "SUPER,7,view,7,0",
    "SUPER,8,view,8,0",
    "SUPER,9,view,9,0",

    # Move Windows to Tags
    "Alt,1,tag,1,0",
    "Alt,2,tag,2,0",
    "Alt,3,tag,3,0",
    "Alt,4,tag,4,0",
    "Alt,5,tag,5,0",
    "Alt,6,tag,6,0",
    "Alt,7,tag,7,0",
    "Alt,8,tag,8,0",
    "Alt,9,tag,9,0",

    # Monitor Switching Controls
    "alt+shift,Left,focusmon,left",
    "alt+shift,Right,focusmon,right",
    "SUPER+Alt,Left,tagmon,left",
    "SUPER+Alt,Right,tagmon,right",

    # Window Gaps Management
    "ALT+SHIFT,X,incgaps,1",
    "ALT+SHIFT,Z,incgaps,-1",
    "ALT+SHIFT,R,togglegaps",

    # Precise Window Positioning
    "CTRL+SHIFT,Up,movewin,+0,-50",
    "CTRL+SHIFT,Down,movewin,+0,+50",
    "CTRL+SHIFT,Left,movewin,-50,+0",
    "CTRL+SHIFT,Right,movewin,+50,+0",

    # Precise Window Resizing
    "CTRL+ALT,Up,resizewin,+0,-50",
    "CTRL+ALT,Down,resizewin,+0,+50",
    "CTRL+ALT,Left,resizewin,-50,+0",
    "CTRL+ALT,Right,resizewin,+50,+0"
]

# Cursor Device Interactions
mousebind = [
    "SUPER,btn_left,moveresize,curmove",
    "SUPER,btn_right,moveresize,curresize"
]

# Axis Wheel Controls
axisbind = [
    "SUPER,UP,viewtoleft_have_client",
    "SUPER,DOWN,viewtoright_have_client"
]

